name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without API activity.
# This pings the project once a day so it stays active.
# NOTE: GitHub only runs *scheduled* workflows from the default branch,
# so this file must live on main.

on:
  schedule:
    - cron: "23 2 * * *" # daily 02:23 UTC (~08:08 NPT)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Auth health check
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="https://jwslcxgnwlsqbrtmmqvf.supabase.co/auth/v1/health"
          echo "Pinging $url"
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            curl --fail --silent --show-error --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" "$url"
          else
            curl --fail --silent --show-error --max-time 30 "$url"
          fi
          echo

      - name: Database ping via PostgREST
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY secret is not set - DB ping skipped (health check above still ran)"
            exit 0
          fi
          code=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://jwslcxgnwlsqbrtmmqvf.supabase.co/rest/v1/hospitals?select=id&limit=1")
          echo "GET /rest/v1/hospitals -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected HTTP $code from PostgREST ping"
            exit 1
          fi
